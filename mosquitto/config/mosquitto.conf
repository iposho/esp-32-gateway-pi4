persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# --- MQTT (TCP) для ESP32 в локальной сети ---
listener 1883
protocol mqtt

# --- WebSockets (для отладки/веб-клиентов при необходимости) ---
listener 9001
protocol websockets

# Авторизация: файл паролей обязателен в проде.
# Для первого запуска можно временно включить анонимный доступ (не для прода!).
allow_anonymous false
password_file /mosquitto/config/passwd

# ACL — ограничение топиков по пользователям (см. README).
acl_file /mosquitto/config/acl

# Не отправлять одно сообщение дважды, если подписки клиента пересекаются.
#
# У Node-RED есть и общий фильтр devices/# (аудит MQTT-трафика), и точные
# devices/+/status|telemetry|capabilities. Mosquitto по умолчанию делает копию
# на каждую совпавшую подписку, поэтому каждое сообщение устройства
# обрабатывалось дважды: телеметрия ложилась двумя строками (вдвое больше
# данных, вдвое медленнее опрос), а mqtt_events — двумя записями.
# С false клиент получает одно сообщение с наибольшим QoS из совпавших
# подписок (подписка devices/# в аудите — qos 0, поэтому аудит не пострадает).
allow_duplicate_messages false
